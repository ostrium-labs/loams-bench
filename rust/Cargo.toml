[package]
name = "loams-bench"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace]

[dependencies]
anyhow = "1"
hdrhistogram = "7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
redis = { version = "=0.29.2", features = ["tokio-comp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "fs"] }
tokio-postgres = "0.7"

[profile.release]
debug = false
strip = "debuginfo"
lto = "thin"
codegen-units = 1
