name: Release Rust benchmark suite
on:
  workflow_dispatch:
    inputs:
      build_engines:
        type: boolean
        default: true
        description: Build pinned Loams release binaries after the Rust clients
  push:
    branches: [bench/release-engine-suite]
    paths: ['rust/**', '.github/workflows/release-suite.yml']
permissions:
  contents: read
concurrency:
  group: release-benchmark-suite
  cancel-in-progress: false
jobs:
  client:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Toolchain and shared target
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          mkdir -p "$HOME/.cargo" release-artifacts
          sudo mkdir -p /mnt/Projects/rust-cache/target
          sudo chown "$(id -u):$(id -g)" /mnt/Projects/rust-cache/target
          printf '[build]\ntarget-dir="/mnt/Projects/rust-cache/target"\njobs=2\n' > "$HOME/.cargo/config.toml"
          rustc +1.97.1 -Vv > release-artifacts/compiler.txt
          git rev-parse HEAD > release-artifacts/benchmark-source.txt
          df -h /mnt/Projects
          test "$(df --output=avail -k /mnt/Projects | tail -1)" -ge 15728640
      - name: Check and build Rust clients
        env:
          LOAMS_BENCH_REVISION: ${{ github.sha }}
        run: |
          cargo +1.97.1 fmt --manifest-path rust/Cargo.toml --check
          cargo +1.97.1 clippy --locked --manifest-path rust/Cargo.toml --all-targets -- -D warnings
          cargo +1.97.1 build --release --locked --manifest-path rust/Cargo.toml
          cp /mnt/Projects/rust-cache/target/release/loams-bench release-artifacts/
          sha256sum release-artifacts/loams-bench > release-artifacts/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: release-rust-client
          path: release-artifacts/
  engines:
    if: github.event_name == 'workflow_dispatch' && inputs.build_engines
    needs: client
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ostrium-labs/loams
          ref: 61b1d878089cdddfdddf281adc0991aa6fdc30b9
          path: source
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libprotobuf-dev pkg-config libssl-dev clang lld cmake g++ make perl
          rustup toolchain install 1.97.1 --profile minimal
          sudo mkdir -p /mnt/Projects/rust-cache/target
          sudo chown "$(id -u):$(id -g)" /mnt/Projects/rust-cache/target
          mkdir -p "$HOME/.cargo" release-artifacts
          printf '[build]\ntarget-dir="/mnt/Projects/rust-cache/target"\njobs=2\nincremental=false\n' > "$HOME/.cargo/config.toml"
          rustc +1.97.1 -Vv > release-artifacts/compiler.txt
          git -C source rev-parse HEAD > release-artifacts/loams-source.txt
      - name: Release engine core and gateways
        working-directory: source
        run: |
          test "$(df --output=avail -k /mnt/Projects | tail -1)" -ge 15728640
          cargo +1.97.1 build --release --locked -p loams --bin loams --features live,live-tikv,durable,durable-tikv,graph,git,tikv,pgwire,mysql-wire,stream-grpc,spark
          cargo +1.97.1 build --release --locked -p loams-gateway --bin loams-gateway --features temporal,spark,resp
          cargo +1.97.1 build --release --locked -p loams-temporal-frontend -p loams-spark -p loams-live-js -p loams-agentd -p loams-git-remote --bins
          cargo +1.97.1 build --release --locked -p loams-live-js --features agent --bin loams-agent-worker
      - name: Release House and Event Fabric
        working-directory: source
        run: |
          test "$(df --output=avail -k /mnt/Projects | tail -1)" -ge 15728640
          cargo +1.97.1 build --release --locked --manifest-path fabric/Cargo.toml -p loams-fabric --features connectors --bins
          cargo +1.97.1 build --release --locked --manifest-path fabric/Cargo.toml -p loams-house-engine -p loams-house-worker -p loams-flow-conformance --bins
      - name: Package exact release binaries
        run: |
          for binary in loams loams-gateway loams-temporal loams-spark-proxy loams-live-worker loams-agent-worker loams-agentd git-remote-loams loams-fabric loams-house-engine-dev loams-house-worker loams-connectors-bench; do
            test -x "/mnt/Projects/rust-cache/target/release/$binary"
            cp "/mnt/Projects/rust-cache/target/release/$binary" release-artifacts/
          done
          cd release-artifacts
          sha256sum loams* git-remote-loams > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: release-loams-engines
          path: release-artifacts/
